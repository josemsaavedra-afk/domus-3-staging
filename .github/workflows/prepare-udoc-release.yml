name: Prepare DOMUS 30160 review build
on:
  push:
    branches: [work/udoc-30159-safe-integration]
    paths:
      - 'scripts/prepare-udoc-release.py'
      - '.github/workflows/prepare-udoc-release.yml'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/udoc-30159-safe-integration
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare version and integrity manifest
        run: python3 scripts/prepare-udoc-release.py 30160
      - name: Verify complete application
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Commit reviewed build files to isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add domus-3/version.json domus-3/index.html domus-3/sw.js domus-3/asset-manifest.js
          git commit -m 'Prepare DOMUS 30160 review build with verified PWA hashes'
          git push origin HEAD:work/udoc-30159-safe-integration
