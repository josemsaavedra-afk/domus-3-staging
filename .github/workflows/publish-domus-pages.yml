name: Publish DOMUS 3 to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'domus-3/**'
      - '.github/workflows/publish-domus-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: domus-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}domus-3/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Test application and PWA asset integrity
        run: npm test
      - name: Prepare Pages content
        run: |
          mkdir -p _site
          cp -a domus-3 _site/domus-3
          printf '%s\n' '<!doctype html><html lang="es"><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=./domus-3/"><title>DOMUS</title><a href="./domus-3/">Abrir DOMUS</a></html>' > _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
