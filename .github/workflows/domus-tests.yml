name: DOMUS tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: sha256sum domus-3/index.html domus-3/src/treasury/plan-import.js domus-3/planes-asturias-2026.json
      - run: npm test
      - name: Install isolated browser regression runner
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Verify statement preview survives refresh in Chromium
        run: |
          node scripts/test-statement-preview.mjs
          node scripts/test-statement-candidate.mjs
          node scripts/test-category-rule.mjs
          node scripts/test-statement-workflow.mjs
          node scripts/test-udoc-review.mjs
